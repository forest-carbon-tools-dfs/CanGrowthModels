name: collect-usage

# GitHub keeps only 14 days of traffic, so archive it weekly on the
# stats-data branch. Stars/forks and release downloads are snapshotted too.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Mount the archive branch at usage-data/, creating it on the first run
      - name: Check out stats-data branch
        run: |
          git fetch origin stats-data || true
          if git show-ref --verify --quiet refs/remotes/origin/stats-data; then
            git worktree add -B stats-data usage-data origin/stats-data
          else
            git worktree add --orphan -b stats-data usage-data
          fi

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install collector dependencies
        run: Rscript -e 'install.packages(c("jsonlite", "readr"))'

      # Traffic needs a token with repository Administration (read) access.
      # Without the TRAFFIC_TOKEN secret, traffic is skipped and the rest still runs.
      - name: Collect usage statistics
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN || secrets.GITHUB_TOKEN }}
        run: Rscript scripts/collect_usage.R

      - name: Commit archive
        working-directory: usage-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to archive"
          else
            git commit -m "Update usage statistics"
            git push origin stats-data
          fi
