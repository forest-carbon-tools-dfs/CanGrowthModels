project:
  type: website
  render:
    - index.qmd
    - models.qmd
  pre-render:
    - Rscript R/validate_CanGYmodels.R
    - Rscript R/validate_model_coverage.R
    - Rscript R/validate_model_links.R
    - Rscript R/build_CanGYmodel_data.R

website:
  title: "Canadian Forest Growth & Yield Model Registry"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: models.qmd
        text: Models

format:
  html:
    theme:
      - cosmo
      - brand
    toc: true

editor: visual
